<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>VirtualXP Improved</title>
    <meta property="og:title" content="VirtualXP Improved" />
    <meta property="og:url" content="./VirtualXP/index.html" />
    <meta property="og:description" content="A web-based Windows XP emulator." />
    <meta property="og:image" content="./src/VirtualXPFavIcon_192x192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VirtualXP Improved" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="VirtualXP.json" />
    <link rel="icon" type="image/png" href="./src/VirtualXPFavIcon_16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="./src/VirtualXPFavIcon_192x192.png" sizes="192x192" />

    <!-- Built Tailwind CSS (replace with your output.css) -->
    <link href="./output.css" rel="stylesheet" />

    <style>
      /* Custom @apply for reusable components to reduce class duplication */
      .btn-primary { @apply w-full bg-accent hover:bg-blue-500 text-white py-2 rounded-md font-semibold transition-colors; }
      .btn-secondary { @apply w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-md font-semibold transition-colors; }
      .input-field { @apply w-full px-3 py-2 bg-gray-800 text-white rounded-md outline-none focus:ring-2 focus:ring-accent; }
      .checkbox-label { @apply flex items-center gap-3; }
      .glass { @apply bg-white/10 backdrop-blur-md border border-white/20 shadow-lg; }
      .canvas-container { @apply fixed inset-0 flex items-center justify-center bg-black; }
      .spinner { @apply border-4 border-white/20 border-l-accent animate-spin rounded-full w-6 h-6; }
      /* Dark mode already enabled via class="dark" */
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; } }
    </style>
  </head>

  <body class="bg-gray-900 text-white font-sans antialiased">
    <!-- Boot Options Modal -->
    <div
      id="bootOptionsModal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none"
      role="dialog"
      aria-labelledby="bootOptionsTitle"
      aria-modal="true"
    >
      <div
        id="bootOptionsModalContent"
        class="glass w-full max-w-md rounded-xl p-6 transform scale-95 opacity-0 transition-all duration-300"
      >
        <div class="flex justify-between items-center mb-4">
          <h3 id="bootOptionsTitle" class="text-xl font-bold">VirtualXP Boot Options</h3>
          <button
            onclick="closeBootOptionsModal()"
            class="text-gray-300 hover:text-white text-2xl"
            aria-label="Close Boot Options Modal"
            type="button"
          >
            &times;
          </button>
        </div>

        <div class="text-sm text-gray-300 mb-6">
          <p>Configure emulator settings for optimal performance.</p>
          <p class="mt-2">Low Perf Mode recommended for mobile devices.</p>
        </div>

        <form id="bootOptionsForm" class="space-y-4" autocomplete="off">
          <div>
            <label for="memoryMB" class="block font-medium mb-1">Memory (MB)</label>
            <input type="number" id="memoryMB" name="memoryMB" min="64" max="4096" value="256" required class="input-field" />
          </div>

          <div>
            <label for="vramMB" class="block font-medium mb-1">Video Memory (MB)</label>
            <input type="number" id="vramMB" name="vramMB" min="16" max="4096" value="32" required class="input-field" />
          </div>

          <div>
            <label for="bootMode" class="block font-medium mb-1">Boot Mode</label>
            <select id="bootMode" name="bootMode" class="input-field">
              <option value="normal" selected>Normal</option>
              <option value="safemode">Safe Mode</option>
            </select>
          </div>

          <div class="checkbox-label">
            <input type="checkbox" id="enableSound" class="accent-accent h-4 w-4" />
            <label for="enableSound" class="text-sm cursor-pointer">Enable Sound</label>
          </div>

          <div class="checkbox-label">
            <input type="checkbox" id="debugMode" class="accent-accent h-4 w-4" />
            <label for="debugMode" class="text-sm cursor-pointer">Enable Debug Mode</label>
          </div>

          <div class="checkbox-label">
            <input type="checkbox" id="lowPerfMode" class="accent-accent h-4 w-4" />
            <label for="lowPerfMode" class="text-sm cursor-pointer">Low Perf Mode (for mobile)</label>
          </div>

          <div>
            <label for="bootDelay" class="block font-medium mb-1">Boot Delay (ms)</label>
            <input type="number" id="bootDelay" name="bootDelay" min="0" max="10000" value="0" class="input-field" />
          </div>

          <button type="submit" class="btn-primary">Start Emulator</button>

          <button type="button" id="resetBootOptionsBtn" class="btn-secondary">Reset to Defaults</button>

          <label for="loadBootOptionsFile" class="block mt-4 text-center text-accent hover:underline cursor-pointer">
            Load Settings from JSON
          </label>
          <input type="file" id="loadBootOptionsFile" accept=".json,application/json" class="hidden" />
        </form>
      </div>
    </div>

    <!-- Loading UI -->
    <div
      id="loadingUI"
      class="hidden fixed inset-0 flex items-center justify-center bg-gray-900/80 text-white z-40"
    >
      <div class="flex items-center gap-3">
        <div class="spinner"></div>
        <span>Loading VirtualXP...</span>
      </div>
    </div>
    <div id="progress" class="fixed top-2 left-2 text-sm text-white hidden"></div>

    <!-- Performance Monitor Overlay (hidden by default) -->
    <div id="perfMonitor" class="fixed bottom-2 right-2 text-xs text-gray-300 bg-black/50 p-2 rounded hidden">
      MIPS: <span id="mipsVal">0</span> | CPU: <span id="cpuVal">0</span> MHz
    </div>

    <!-- Emulator Canvas -->
    <div class="canvas-container">
      <canvas id="canvas" class="max-w-full max-h-full object-contain" tabindex="1" aria-label="VirtualXP Emulator Display"></canvas>
    </div>

    <script type="module" src="./virtualxp-optimized.js" defer></script>
  </body>
</html>
